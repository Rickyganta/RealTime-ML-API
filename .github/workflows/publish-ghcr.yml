# Push API image to GitHub Container Registry (GHCR).
# Railway "Docker image" deploy: paste ghcr.io/<owner-lowercase>/realtime-ml-api:latest
name: Publish API image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for docker push to ghcr.io with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects mixed-case host/path; normalize owner to lowercase
      - name: Set image tags
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          base="ghcr.io/${owner}/realtime-ml-api"
          echo "IMAGE_TAG_LATEST=${base}:latest" >> "$GITHUB_ENV"
          echo "IMAGE_TAG_SHA=${base}:${{ github.sha }}" >> "$GITHUB_ENV"
          echo "Pushing ${base}:latest and ${base}:${{ github.sha }}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_TAG_LATEST }}
            ${{ env.IMAGE_TAG_SHA }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
