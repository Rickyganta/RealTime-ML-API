# Push API image to GitHub Container Registry (GHCR).
# Railway "Docker image" deploy: paste ghcr.io/<owner-lowercase>/realtime-ml-api:latest
name: Publish API image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for docker push to ghcr.io with GITHUB_TOKEN
permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects mixed-case host/path; normalize owner to lowercase
      - name: Set image tag
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          tag="ghcr.io/${owner}/realtime-ml-api:latest"
          echo "IMAGE_TAG=${tag}" >> "$GITHUB_ENV"
          echo "Pushing ${tag}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
